<title>OUT価格計算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<style>
/* Layout: 1カラムの計算パネル。入力 → 結果2枚 → 価格の並び(はしご)の順 */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --fg: #16201c;
  --muted: #5f6e68;
  --line: #d9e0dc;
  --accent: #1f5d4a;
  --accent-fg: #ffffff;
  --loss: #c23a3a;
  --loss-bg: #fbeeee;
  --gain: #17795a;
  --gain-bg: #e8f5ef;
  --font-sans: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513;
    --surface: #18201d;
    --fg: #e6ede9;
    --muted: #93a39b;
    --line: #2b3732;
    --accent: #5fc2a0;
    --accent-fg: #0b1512;
    --loss: #f08080;
    --loss-bg: #2c1a1a;
    --gain: #5fd0a4;
    --gain-bg: #14281f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513;
  --surface: #18201d;
  --fg: #e6ede9;
  --muted: #93a39b;
  --line: #2b3732;
  --accent: #5fc2a0;
  --accent-fg: #0b1512;
  --loss: #f08080;
  --loss-bg: #2c1a1a;
  --gain: #5fd0a4;
  --gain-bg: #14281f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 28px 48px;
}
.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.sub b { font-family: var(--font-mono); font-weight: 600; color: var(--fg); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

.copy:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.field.wide { grid-column: 1 / -1; }
.input { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding-inline: 12px; min-width: 0; }
.input:focus-within { border-color: var(--accent); }
.input input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg);
  font-family: var(--font-mono); font-size: 18px; font-weight: 500; padding-block: 10px; outline: none;
  font-variant-numeric: tabular-nums;
}
.input .unit { color: var(--muted); font-size: 13px; padding-left: 6px; white-space: nowrap; }

details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details .fields { margin-top: 12px; }
.rr { margin: 10px 0 0; font-size: 12px; color: var(--muted); }

.results { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.res { border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.res.loss { background: var(--loss-bg); color: var(--loss); }
.res.gain { background: var(--gain-bg); color: var(--gain); }
.res .tag { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
.res .price { font-family: var(--font-mono); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; overflow-wrap: anywhere; }
.res .meta { font-size: 12px; color: var(--fg); opacity: 0.8; font-variant-numeric: tabular-nums; }
.copy {
  align-self: flex-start; margin-top: 8px; font: inherit; font-size: 12px; font-weight: 500; padding: 4px 12px;
  border: 1px solid currentColor; border-radius: 6px; background: transparent; color: inherit; cursor: pointer;
}

.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ladder li { display: grid; grid-template-columns: 4.5em 1fr auto; gap: 12px; align-items: baseline; padding-block: 10px; border-top: 1px dashed var(--line); }
.ladder li:first-child { border-top: 0; }
.ladder .name { font-size: 13px; font-weight: 600; }
.ladder .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; }
.ladder .diff { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ladder .tp .name { color: var(--gain); }
.ladder .sl .name { color: var(--loss); }
.ladder .en .name { color: var(--muted); }
.panel h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; }

.warn { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--loss-bg); color: var(--loss); font-size: 13px; }
.note { margin: 0; font-size: 12px; color: var(--muted); }

@media (max-width: 420px) {
  .results { grid-template-columns: 1fr; }
  .res .price { font-size: 24px; }
}
</style>

<main class="wrap">
  <header>
    <h1>Out Price</h1>
    <p class="sub">RR 1:2 / <b id="subLoss">-10,000円</b> /  <b id="subGain">+20,000円</b></p>
  </header>

  <section class="panel" aria-label="入力">
    <div class="fields">
      <div class="field wide">
        <label for="capital">元金</label>
        <div class="input"><input id="capital" type="text" inputmode="decimal" autocomplete="off" value="8"><span class="unit">百万円</span></div>
        <span class="note" id="capitalYen"></span>
      </div>
      <div class="field">
        <label for="entry">エントリー価格</label>
        <div class="input"><input id="entry" type="text" inputmode="decimal" autocomplete="off" value="1500"><span class="unit">円</span></div>
      </div>
      <div class="field">
        <label for="qty">枚数 </label>
        <div class="input"><input id="qty" type="text" inputmode="decimal" autocomplete="off" value="600"><span class="unit">枚</span></div>
      </div>
    </div>
    <p class="note" id="qtyHint"></p>

    <details>
      <summary>RR Settings</summary>
      <div class="fields">
        <div class="field">
          <label for="lossAmt">損切り額</label>
          <div class="input"><input id="lossAmt" type="text" inputmode="decimal" autocomplete="off" value="10000"><span class="unit">円</span></div>
        </div>
        <div class="field">
          <label for="gainAmt">利確額</label>
          <div class="input"><input id="gainAmt" type="text" inputmode="decimal" autocomplete="off" value="20000"><span class="unit">円</span></div>
        </div>
      </div>
      <p class="rr" id="rrText"></p>
    </details>

    <p class="warn" id="warn" hidden></p>
  </section>

  <section class="results" aria-label="計算結果" id="results">
    <div class="res loss">
      <span class="tag">SL</span>
      <span class="price" id="slPrice">-</span>
      <span class="meta" id="slMeta"></span>
      <button type="button" class="copy" data-target="slPrice">コピー</button>
    </div>
    <div class="res gain">
      <span class="tag">TP</span>
      <span class="price" id="tpPrice">-</span>
      <span class="meta" id="tpMeta"></span>
      <button type="button" class="copy" data-target="tpPrice">コピー</button>
    </div>
  </section>

  <section class="panel" aria-label="価格の並び">
    <h2>価格の並び</h2>
    <ol class="ladder" id="ladder"></ol>
      </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var raw = { sl: "", tp: "" };
  var nf = new Intl.NumberFormat("ja-JP", { maximumFractionDigits: 4 });
  var yen = new Intl.NumberFormat("ja-JP", { maximumFractionDigits: 0 });

  function num(id) {
    var v = $(id).value.replace(/[,\s円枚]/g, "").replace(/[０-９．]/g, function (c) {
      return c === "．" ? "." : String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    });
    if (v === "") return NaN;
    return Number(v);
  }

  function clean(n) { return parseFloat(n.toFixed(6)); }

  // 元金欄は100万円単位 (1.5 → 1,500,000円)
  function capitalYen() {
    return Math.round(num("capital") * 1000000);
  }

  // 元金とエントリー価格から、100株単位で買える最大枚数を求める
  function maxQty(capital, entry) {
    if (!(capital > 0 && entry > 0)) return 0;
    return Math.floor(Math.floor(capital / entry) / 100) * 100;
  }

  // 元金・エントリー価格が変わったら枚数を最大枚数に自動入力
  function autoQty() {
    $("qty").value = String(maxQty(capitalYen(), num("entry")));
    render();
  }

  function updateHint(capital, entry, qty) {
    var hint = $("qtyHint");
    if (!(capital > 0 && entry > 0)) {
      hint.textContent = "元金とエントリー価格を入力すると、100株単位の最大枚数を自動入力します。";
      return;
    }
    var max = maxQty(capital, entry);
    if (max === 0) {
      hint.textContent = "元金が足りません。100株の購入に " + yen.format(Math.ceil(entry * 100)) + "円必要です。";
      return;
    }
    var text = "元金内の最大 " + yen.format(max) + "枚 (必要資金 " + yen.format(Math.round(max * entry)) +
      "円 / 残り " + yen.format(Math.round(capital - max * entry)) + "円)";
    if (qty > 0 && qty * entry > capital) text += " 入力中の枚数は元金を超えています。";
    hint.textContent = text;
  }

  function render() {
    var capital = capitalYen(), entry = num("entry"), qty = num("qty"), lossAmt = num("lossAmt"), gainAmt = num("gainAmt");
    var warn = $("warn");
    $("capitalYen").textContent = capital > 0 ? "= " + yen.format(capital) + "円" : "";
    updateHint(capital, entry, qty);
    var ok = entry > 0 && qty > 0 && lossAmt > 0 && gainAmt > 0;

    $("subLoss").textContent = lossAmt > 0 ? "-" + yen.format(lossAmt) + "円" : "-";
    $("subGain").textContent = gainAmt > 0 ? "+" + yen.format(gainAmt) + "円" : "-";
    $("rrText").textContent = lossAmt > 0 && gainAmt > 0 ? "リスクリワード 1 : " + nf.format(clean(gainAmt / lossAmt)) : "";

    if (!ok) {
      $("slPrice").textContent = "-"; $("tpPrice").textContent = "-";
      $("slMeta").textContent = ""; $("tpMeta").textContent = "";
      $("ladder").innerHTML = "";
      raw.sl = raw.tp = "";
      warn.hidden = false;
      warn.textContent = "エントリー価格と枚数に0より大きい数字を入力してください。";
      return;
    }

    var slW = lossAmt / qty, tpW = gainAmt / qty;
    var sl = Math.floor(clean(entry - slW)), tp = Math.floor(clean(entry + tpW));

    if (sl <= 0 || tp <= 0) {
      warn.hidden = false;
      warn.textContent = "計算上の価格が0以下になります。枚数か損益額を見直してください。";
    } else {
      warn.hidden = true;
    }

    raw.sl = String(sl); raw.tp = String(tp);
    $("slPrice").textContent = nf.format(sl);
    $("tpPrice").textContent = nf.format(tp);
    $("slMeta").textContent = "値幅 " + nf.format(clean(slW)) + " / -" + yen.format(lossAmt) + "円";
    $("tpMeta").textContent = "値幅 " + nf.format(clean(tpW)) + " / +" + yen.format(gainAmt) + "円";

    var rows = [
      { cls: "tp", name: "利確", p: tp, d: gainAmt, sign: "+" },
      { cls: "en", name: "エントリー", p: entry, d: 0, sign: "" },
      { cls: "sl", name: "損切", p: sl, d: lossAmt, sign: "-" }
    ];
    rows.sort(function (a, b) { return b.p - a.p; });
    $("ladder").innerHTML = rows.map(function (r) {
      var diff = r.d ? r.sign + yen.format(r.d) + "円" : "";
      return '<li class="' + r.cls + '"><span class="name">' + r.name + '</span><span class="val">' +
        nf.format(r.p) + '</span><span class="diff">' + diff + '</span></li>';
    }).join("");
  }

  ["qty", "lossAmt", "gainAmt"].forEach(function (id) { $(id).addEventListener("input", render); });
  ["capital", "entry"].forEach(function (id) { $(id).addEventListener("input", autoQty); });

  document.querySelectorAll(".copy").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var key = btn.dataset.target === "slPrice" ? raw.sl : raw.tp;
      if (!key) return;
      var done = function (t) {
        btn.textContent = t;
        setTimeout(function () { btn.textContent = "コピー"; }, 1200);
      };
      try {
        navigator.clipboard.writeText(key).then(function () { done("コピーしました"); }, function () { done("コピー不可"); });
      } catch (e) { done("コピー不可"); }
    });
  });

  autoQty();
})();
</script>
