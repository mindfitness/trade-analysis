<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="https://github.com/user-attachments/assets/25246467-96eb-4a5c-8277-69febbe0b86a">
    <link rel="apple-touch-icon" href="https://github.com/user-attachments/assets/25246467-96eb-4a5c-8277-69febbe0b86a">
    <link rel="shortcut icon" href="https://github.com/user-attachments/assets/25246467-96eb-4a5c-8277-69febbe0b86a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Trade Analysis (Dark)</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        :root { 
            --primary: #3b82f6; 
            --win-deep: #10b981; 
            --lose-deep: #ef4444; 
            --bg: #0f172a; 
            --card: #1e293b;
            --header: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
            --ai-accent: #8b5cf6;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); margin: 0; padding-bottom: env(safe-area-inset-bottom);
            color: var(--text-main); font-size: 14px;
        }

        header { background: var(--header); padding: 12px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .nav-tabs { display: flex; gap: 4px; margin-top: 12px; }
        .tab { 
            flex: 1; padding: 8px 4px; border: none; background: #334155; border-radius: 8px; 
            font-weight: bold; color: var(--text-sub); font-size: 0.7rem; cursor: pointer;
            white-space: nowrap;
        }
        .tab.active { background: var(--primary); color: white; }
        .tab.ai-tab.active { background: var(--ai-accent); color: white; }

        .page { padding: 12px; display: none; }
        .page.active { display: block; }

        section { background: var(--card); padding: 16px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 16px; }
        .section-title { font-size: 0.85rem; font-weight: 800; margin-bottom: 12px; color: var(--text-main); }
        .input-group { margin-bottom: 12px; }
        input, textarea { 
            width: 100%; padding: 10px; background: var(--input-bg); border: 1px solid var(--border); 
            border-radius: 8px; font-size: 1rem; color: white;
        }

        .check-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
        .check-box { 
            background: #334155; padding: 6px 4px; border-radius: 8px; font-size: 0.65rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center; text-align: center; border: 1px solid transparent;
            min-height: 42px; line-height: 1.1; color: var(--text-sub);
        }
        .check-box.checked { background: #1e40af; border-color: var(--primary); color: white; }
        .check-box.negative.checked { background: #7f1d1d; border-color: var(--lose-deep); color: white; }
        .check-box input { display: none; }

        .submit-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; }
        
        /* プロンプトページ専用スタイル */
        .prompt-container-static { background: #000; padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
        .prompt-container-static pre { font-family: monospace; font-size: 0.8rem; color: #a7f3d0; white-space: pre-wrap; margin: 0; line-height: 1.4; word-break: break-all; }
        .copy-btn-static { background: #334155; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; font-weight: bold; }
        .copy-btn-static.copied { background: var(--win-deep); }

        .history-summary { display: flex; gap: 10px; margin-bottom: 16px; }
        .summary-box { flex: 1; padding: 12px; border-radius: 12px; text-align: center; cursor: pointer; border: 2px solid var(--border); background: var(--card); }
        .summary-box.active-win { border-color: var(--win-deep); background: #064e3b; }
        .summary-box.active-lose { border-color: var(--lose-deep); background: #7f1d1d; }

        .trade-card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
        .tag-container { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
        .tag { font-size: 0.65rem; background: #334155; padding: 2px 6px; border-radius: 4px; color: var(--text-sub); }
        .tag.negative { background: #450a0a; border-color: #991b1b; color: #f87171; }
        .memo-area { font-size: 0.8rem; background: #451a03; padding: 8px 10px; border-radius: 6px; border-left: 3px solid #f59e0b; margin-top: 6px; color: #fed7aa; }
        .res-actions { display: flex; gap: 8px; margin-top: 10px; }
        .res-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; color: white; font-weight: 800; }
        .btn-win { background: var(--win-deep); }
        .btn-lose { background: var(--lose-deep); }
    </style>
</head>
<body>

<header>
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1 style="margin:0; font-size:1.2rem; font-weight:900; color:white;">Trade Analysis</h1>
        <button onclick="switchPage('entry')" style="border:none; background:none; color:var(--primary); font-weight:bold; cursor:pointer;">+ 新規</button>
    </div>
    <div class="nav-tabs">
        <button class="tab active" id="tab-active" onclick="switchPage('active')">取引中</button>
        <button class="tab" id="tab-history" onclick="switchPage('history')">分析</button>
        <button class="tab ai-tab" id="tab-ai" onclick="switchPage('ai')">プロンプト</button>
    </div>
</header>

<div id="page-entry" class="page">
    <section>
        <div class="input-group"><input type="text" id="stock-name" placeholder="銘柄コード (例: NVDA)"></div>
        <div class="input-group"><input type="number" id="entry-price" placeholder="価格"></div>
        <div class="section-title" style="color: var(--win-deep);">✓ +項目</div>
        <div id="entry-check-grid-positive" class="check-grid"></div>
        <div class="section-title" style="color: var(--lose-deep); margin-top: 16px;">⚠ -項目</div>
        <div id="entry-check-grid-negative" class="check-grid"></div>
        <div class="input-group" style="margin-top: 16px;">
            <textarea id="trade-memo" placeholder="備考など" rows="2"></textarea>
        </div>
        <button onclick="registerTrade()" class="submit-btn">エントリーを記録</button>
    </section>
</div>

<div id="page-active" class="page active">
    <div id="active-container"></div>
</div>

<div id="page-history" class="page">
    <div class="history-summary">
        <div id="box-win" class="summary-box active-win" onclick="setHistoryFilter('win')">
            <div style="font-size:0.7rem; font-weight:800; color: var(--win-deep);">WIN</div>
            <div id="count-win" style="font-size: 1.4rem; font-weight: 900; color: var(--win-deep);">0</div>
        </div>
        <div id="box-lose" class="summary-box" onclick="setHistoryFilter('lose')">
            <div style="font-size:0.7rem; font-weight:800; color: var(--lose-deep);">LOSE</div>
            <div id="count-lose" style="font-size: 1.4rem; font-weight: 900; color: var(--lose-deep);">0</div>
        </div>
    </div>
    <div id="history-container"></div>
</div>

<div id="page-ai" class="page">
    <div class="section-title" style="color: var(--ai-accent); display: flex; align-items: center; gap: 6px;">
        <i data-lucide="bot" style="width:16px;"></i> プロンプトストック
    </div>

    <section>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 0.75rem; font-weight: bold; color: var(--ai-accent);">Final Check</span>
            <button class="copy-btn-static" onclick="copyStaticPrompt('prompt-1', this)">コピー</button>
        </div>
        <div class="prompt-container-static">
            <pre id="prompt-1">過去48時間以内の英語ポスト分析。アメリカ株　について、センチメントを分析せよ。テクニカルやfundamentals、ニュースなどの情報から、bullish/bearishを評価せよ。回答は日本語で出力せよ。</pre>
        </div>
    </section>

    <section>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 0.75rem; font-weight: bold; color: var(--ai-accent);">市場センチメント</span>
            <button class="copy-btn-static" onclick="copyStaticPrompt('prompt-2', this)">コピー</button>
        </div>
        <div class="prompt-container-static">
            <pre id="prompt-2">例えば関税が発動すると株価は下がる。投資する前にそのような政治経済のセンチメントを調査したい。今日の米国株に投資するのはどうか。また、直近で重要な指標の発表（経済カレンダー）があれば教えて。</pre>
        </div>
    </section>

    <section>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 0.75rem; font-weight: bold; color: var(--ai-accent);">NA</span>
            <button class="copy-btn-static" onclick="copyStaticPrompt('prompt-3', this)">コピー</button>
        </div>
        <div class="prompt-container-static">
            <pre id="prompt-3">NA</pre>
        </div>
    </section>
</div>

<script>
const positiveItems = ["RS=100%", "RS21>63緑", "RS10>21緑", "RS(XL)緑", "RS=all緑", "テーマ1&5=緑", "テーマ5&10=緑", "テーマ=all緑", "1M>25", "Break-Out", "21>50>200", "出来高", "GC", "21screen", "AT", "W", "CUP", "pivot反発", "平均線サポート", "雲サポート", "雲上抜け", "ATR=all緑", "セクタ=緑", "ATH", "VCS>60"];
const negativeItems = ["RS", "出来高", "ATR", "3α", "抵抗", "三角", "セクタ", "ATR%50", "2α"];

let trades = [];
const API_URL = "/api";

function switchPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    
    const targetPage = document.getElementById(`page-${pageId}`);
    const targetTab = document.getElementById(`tab-${pageId}`);
    
    if (targetPage) targetPage.classList.add('active');
    if (targetTab) targetTab.classList.add('active');
    
    if(window.lucide) lucide.createIcons();
}

// プロンプトコピー関数
function copyStaticPrompt(elementId, btn) {
    const text = document.getElementById(elementId).innerText;
    navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerText;
        btn.innerText = "完了！";
        btn.classList.add('copied');
        setTimeout(() => {
            btn.innerText = originalText;
            btn.classList.remove('copied');
        }, 2000);
    });
}

function renderEntryChecks() {
    document.getElementById('entry-check-grid-positive').innerHTML = positiveItems.map(item => `
        <label class="check-box">
            <input type="checkbox" class="entry-check-positive" value="${item}" onchange="this.parentElement.classList.toggle('checked', this.checked)">
            ${item}
        </label>
    `).join('');
    document.getElementById('entry-check-grid-negative').innerHTML = negativeItems.map(item => `
        <label class="check-box negative">
            <input type="checkbox" class="entry-check-negative" value="${item}" onchange="this.parentElement.classList.toggle('checked', this.checked)">
            ${item}
        </label>
    `).join('');
}

async function loadTrades() {
    try {
        const res = await fetch(API_URL);
        const data = await res.json();
        trades = data.map(t => ({
            id: String(t.trade_id),
            name: t.name,
            price: t.price,
            appliedItems: JSON.parse(t.applied_items || "[]"),
            negativeItems: JSON.parse(t.negative_items || "[]"),
            memo: t.memo || "",
            result: t.result || null
        }));
        renderTrades();
    } catch (err) { console.error(err); }
}

function renderTrades() {
    const activeCont = document.getElementById('active-container');
    const winCount = trades.filter(t => t.result === 'win').length;
    const loseCount = trades.filter(t => t.result === 'lose').length;
    
    if(document.getElementById('count-win')) document.getElementById('count-win').innerText = winCount;
    if(document.getElementById('count-lose')) document.getElementById('count-lose').innerText = loseCount;

    activeCont.innerHTML = trades.filter(t => !t.result).map(t => `
        <div class="trade-card">
            <div style="font-weight:800;">${t.name} <span style="color:var(--text-sub); font-size:0.8rem;">$${t.price}</span></div>
            <div class="tag-container">
                ${t.appliedItems.map(i => `<span class="tag">${i}</span>`).join('')}
                ${t.negativeItems.map(i => `<span class="tag negative">${i}</span>`).join('')}
            </div>
            <div class="memo-area">${t.memo}</div>
            <div class="res-actions">
                <button class="btn-win" onclick="setTradeResult('${t.id}', 'win')">WIN</button>
                <button class="btn-lose" onclick="setTradeResult('${t.id}', 'lose')">LOSE</button>
            </div>
        </div>
    `).join('') || '<p style="text-align:center;color:#475569;">取引なし</p>';
    if(window.lucide) lucide.createIcons();
}

async function registerTrade() {
    const name = document.getElementById('stock-name').value;
    const price = document.getElementById('entry-price').value;
    if (!name || !price) return alert('入力してください');
    
    const newTrade = {
        name: name.toUpperCase(),
        price: price,
        appliedItems: Array.from(document.querySelectorAll('.entry-check-positive:checked')).map(el => el.value),
        negativeItems: Array.from(document.querySelectorAll('.entry-check-negative:checked')).map(el => el.value),
        memo: document.getElementById('trade-memo').value
    };
    await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newTrade) });
    location.reload();
}

async function setTradeResult(id, result) {
    await fetch(`${API_URL}/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ result })
    });
    location.reload();
}

window.onload = () => { 
    renderEntryChecks(); 
    loadTrades(); 
};
</script>
</body>
</html>
